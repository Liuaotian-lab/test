{
  "atom_id": "projection_geometry",
  "description": "directional projection, shadow, blocking or visibility",
  "required_solver_hooks": [
    "compute_projection",
    "compute_occlusion"
  ],
  "required_validators": [
    "projection_direction_validator",
    "projected_overlap_validator"
  ],
  "required_negative_tests": [
    "wrong_projection_axis",
    "occlusion_detector_disabled"
  ],
  "minimum_fidelity": "L2",
  "claim_limit": "evaluated_best",
  "fidelity_levels": {
    "L0": {
      "claim_limit": "exploratory"
    },
    "L1": {
      "claim_limit": "approximate"
    },
    "L2": {
      "claim_limit": "evaluated_best"
    },
    "L3": {
      "claim_limit": "certified_optimal"
    },
    "L4": {
      "claim_limit": "global_optimal"
    }
  }
}
