{
  "atom_id": "geometric_distance",
  "description": "distance, radius and spacing geometry",
  "required_solver_hooks": [
    "compute_distance",
    "check_spacing"
  ],
  "required_validators": [
    "distance_validator",
    "spacing_validator"
  ],
  "required_negative_tests": [
    "wrong_distance",
    "spacing_violation"
  ],
  "minimum_fidelity": "L2",
  "claim_limit": "evaluated_best",
  "fidelity_levels": {
    "L0": {
      "claim_limit": "exploratory"
    },
    "L1": {
      "claim_limit": "approximate"
    },
    "L2": {
      "claim_limit": "evaluated_best"
    },
    "L3": {
      "claim_limit": "certified_optimal"
    },
    "L4": {
      "claim_limit": "global_optimal"
    }
  }
}
