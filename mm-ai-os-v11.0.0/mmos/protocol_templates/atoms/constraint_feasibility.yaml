{
  "atom_id": "constraint_feasibility",
  "description": "constraint feasibility and violations",
  "required_solver_hooks": [
    "check_feasibility"
  ],
  "required_validators": [
    "constraint_validator"
  ],
  "required_negative_tests": [
    "constraint_disabled",
    "infeasible_solution"
  ],
  "minimum_fidelity": "L2",
  "claim_limit": "evaluated_best",
  "fidelity_levels": {
    "L0": {
      "claim_limit": "exploratory"
    },
    "L1": {
      "claim_limit": "approximate"
    },
    "L2": {
      "claim_limit": "evaluated_best"
    },
    "L3": {
      "claim_limit": "certified_optimal"
    },
    "L4": {
      "claim_limit": "global_optimal"
    }
  }
}
