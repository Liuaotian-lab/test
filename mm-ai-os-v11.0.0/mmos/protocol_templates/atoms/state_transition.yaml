{
  "atom_id": "state_transition",
  "description": "dynamic state transition and time stepping",
  "required_solver_hooks": [
    "simulate_state"
  ],
  "required_validators": [
    "state_transition_validator",
    "time_grid_validator"
  ],
  "required_negative_tests": [
    "broken_state_transition",
    "wrong_time_grid"
  ],
  "minimum_fidelity": "L2",
  "claim_limit": "evaluated_best",
  "fidelity_levels": {
    "L0": {
      "claim_limit": "exploratory"
    },
    "L1": {
      "claim_limit": "approximate"
    },
    "L2": {
      "claim_limit": "evaluated_best"
    },
    "L3": {
      "claim_limit": "certified_optimal"
    },
    "L4": {
      "claim_limit": "global_optimal"
    }
  }
}
